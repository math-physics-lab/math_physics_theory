name: Docs

on:
  push:
    branches: [main]
  # Build (but don't deploy) on PRs, so a broken docs build is caught before merge.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deployments share one group so an in-progress one finishes and only the newest
# queued one runs. PR builds get a group per PR and cancel superseded runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Build library
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          test: false
      # doc-gen4 and its dependencies depend only on the toolchain and the
      # doc-gen4 version.
      - name: Cache doc-gen4 build
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages/doc-gen4
            .lake/packages/MD4Lean
            .lake/packages/BibtexQuery
            .lake/packages/UnicodeBasic
            .lake/packages/leansqlite
          key: docgen-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'docbuild/lean-toolchain', 'docbuild/lake-manifest.json') }}
      - name: Generate docs
        run: python3 docbuild/build_docs.py
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docbuild/.lake/build/doc

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
