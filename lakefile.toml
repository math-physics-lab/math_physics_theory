name = "MathPhysicsTheory"
version = "0.1.0"
defaultTargets = ["MathPhysicsTheory"]
testDriver = "tests"

[[lean_lib]]
name = "MathPhysicsTheory"
leanOptions = { weak.linter.mathlibStandardSet = true, weak.linter.style.header = false }

[[lean_lib]]
name = "tests"
globs = ["tests.+"]
